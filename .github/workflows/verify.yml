name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (check + build + verify:build)
    # GitHub-hosted runner (public repo: free minutes). Moved off the self-hosted homelab runner on
    # 2026-10-22 (homelab review: a public repo must not execute PR/dependency code on the trusted box).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Verify (astro check + build + dist gate)
        run: npm run verify
