name: Verify stars

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-stars.yml
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-stars
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 10
    steps:
      - name: Checkout stars
        uses: actions/checkout@v7
        with:
          repository: granolacowboy/stars
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile generator
        run: python -m py_compile scripts/generate.py

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
