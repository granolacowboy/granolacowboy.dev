name: Verify intake-eval-harness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intake-eval-harness.yml
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: "intake-eval-harness branch, tag, or commit to verify"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

# Paid model evaluation remains operator-controlled; this workflow verifies only
# the harness's offline deterministic contract and CLI surface.

concurrency:
  group: verify-intake-eval-harness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 15
    steps:
      - name: Checkout intake-eval-harness
        uses: actions/checkout@v7
        with:
          repository: granolacowboy/intake-eval-harness
          ref: ${{ inputs.target_ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: mcp-eval --help
