name: Verify intake-triage-mcp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intake-triage-mcp.yml
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-intake-triage-mcp
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 20
    steps:
      - name: Checkout intake-triage-mcp
        uses: actions/checkout@v7
        with:
          repository: granolacowboy/intake-triage-mcp
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q --cov=server --cov-report=term-missing

      - name: Verify MCP initialize and tools/list with official client
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          EXPECTED = {
              "intake_list_practice_areas",
              "intake_check_conflicts",
              "intake_validate_matter",
              "intake_draft_followup",
              "intake_log_triage",
          }

          async def main():
              params = StdioServerParameters(command=sys.executable, args=["server.py"])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      result = await session.list_tools()
                      names = {tool.name for tool in result.tools}
                      missing = EXPECTED - names
                      if missing:
                          raise SystemExit(f"missing tools: {sorted(missing)}")
                      print("tools:", ", ".join(sorted(names)))

          asyncio.run(main())
          PY
