name: Verify intake-triage-mcp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intake-triage-mcp.yml
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-intake-triage-mcp
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 20
    steps:
      - name: Checkout intake-triage-mcp
        uses: actions/checkout@v7
        with:
          repository: granolacowboy/intake-triage-mcp
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q --cov=server --cov-report=term-missing

      - name: Verify MCP initialize and tools/list from source
        shell: bash
        run: |
          set -euo pipefail
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"portfolio-ci","version":"0.0.0"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          OUT=$(printf '%s\n' "$REQ" | timeout 120 python server.py 2>/dev/null || true)
          echo "$OUT"
          for tool in intake_list_practice_areas intake_check_conflicts intake_validate_matter intake_draft_followup intake_log_triage; do
            echo "$OUT" | grep -q "\"$tool\"" || {
              echo "::error::tool '$tool' missing from tools/list"
              exit 1
            }
          done
