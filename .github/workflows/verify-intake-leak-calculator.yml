name: Verify intake-leak-calculator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intake-leak-calculator.yml
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-intake-leak-calculator
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, gcd]
    timeout-minutes: 30
    steps:
      - name: Checkout calculator
        uses: actions/checkout@v7
        with:
          repository: granolacowboy/mhsb-intake-leak-calculator
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Type-check
        run: npm run check

      - name: Verify
        run: npm run verify
